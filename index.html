<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H&FM MCQ Exam Prep — MEGA Edition (150 Qs)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e4e1d8;
    --text: #1a1816;
    --muted: #7a756d;
    --accent: #2d5be3;
    --correct: #1a7a4a;
    --correct-bg: #eafaf2;
    --correct-border: #a3d9be;
    --wrong: #c0392b;
    --wrong-bg: #fdf0ef;
    --wrong-border: #f0b0ab;
    --u1: #2d5be3; --u1-bg: #eef2fd;
    --u2: #0e8a5f; --u2-bg: #e8f8f2;
    --u3: #7b3fc4; --u3-bg: #f3edfb;
    --u4: #c45c0a; --u4-bg: #fdf3ea;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .top-bar {
    background: var(--text); color: #fff;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .top-bar-right { display: flex; align-items: center; gap: 16px; }
  .top-bar span { font-family: 'DM Mono', monospace; font-size: 12px; opacity: 0.6; }
  .shuffle-btn {
    font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1);
    color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.15s;
  }
  .shuffle-btn:hover { background: rgba(255,255,255,0.2); }

  .unit-tabs {
    display: flex; background: var(--card);
    border-bottom: 1.5px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .unit-tabs::-webkit-scrollbar { display: none; }
  .utab {
    padding: 12px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; background: none; color: var(--muted);
    border-bottom: 2.5px solid transparent; white-space: nowrap;
    transition: color 0.15s, border-color 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .utab.active { color: var(--text); }
  .utab[data-unit="0"].active { border-bottom-color: var(--u1); }
  .utab[data-unit="1"].active { border-bottom-color: var(--u2); }
  .utab[data-unit="2"].active { border-bottom-color: var(--u3); }
  .utab[data-unit="3"].active { border-bottom-color: var(--u4); }
  .utab:hover:not(.active) { color: var(--text); background: var(--bg); }

  .prog-wrap { height: 3px; background: var(--border); }
  .prog-fill { height: 100%; background: var(--accent); transition: width 0.4s ease; width: 0%; }
  .prog-fill.u0 { background: var(--u1); }
  .prog-fill.u1 { background: var(--u2); }
  .prog-fill.u2 { background: var(--u3); }
  .prog-fill.u3 { background: var(--u4); }

  .scorebar { display: flex; gap: 1px; background: var(--border); border-bottom: 1.5px solid var(--border); }
  .scard { flex: 1; background: var(--card); padding: 9px 14px; text-align: center; }
  .scard-val { font-size: 18px; font-weight: 600; display: block; font-family: 'DM Mono', monospace; }
  .scard-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); display: block; margin-top: 1px; }
  .scard-val.c { color: var(--correct); }
  .scard-val.w { color: var(--wrong); }

  .main { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }

  .q-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 26px 26px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .q-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.3px; }
  .badge-u0 { background: var(--u1-bg); color: var(--u1); }
  .badge-u1 { background: var(--u2-bg); color: var(--u2); }
  .badge-u2 { background: var(--u3-bg); color: var(--u3); }
  .badge-u3 { background: var(--u4-bg); color: var(--u4); }
  .q-num { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
  .q-text { font-size: 15.5px; font-weight: 500; line-height: 1.6; margin-bottom: 18px; color: var(--text); }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px;
    border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer;
    font-size: 13.5px; line-height: 1.55; background: var(--bg); color: var(--text);
    transition: border-color 0.15s, background 0.15s; text-align: left;
    width: 100%; font-family: 'DM Sans', sans-serif;
  }
  .opt:hover:not(.done) { border-color: #b0aaa0; background: #f0ede7; }
  .opt-key {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px; background: var(--card);
  }
  .opt.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct); }
  .opt.correct .opt-key { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong); }
  .opt.wrong .opt-key { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .opt.done { cursor: default; }

  .explanation {
    margin-top: 13px; padding: 12px 15px; border-radius: 10px;
    font-size: 13px; line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }
  .explanation.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
  .explanation.wrong { background: var(--wrong-bg); color: #6b1f18; border: 1px solid var(--wrong-border); }
  .explanation strong { font-weight: 600; display: block; margin-bottom: 4px; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .btn {
    padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--card);
    color: var(--text); font-family: 'DM Sans', sans-serif; transition: background 0.15s;
  }
  .btn:hover { background: var(--bg); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover { opacity: 0.85; }

  .summary-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 36px 28px; text-align: center;
  }
  .summary-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .summary-card .sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .big-score {
    font-size: 64px; font-weight: 600; font-family: 'DM Mono', monospace;
    line-height: 1; margin-bottom: 8px;
  }
  .big-score.great { color: var(--correct); }
  .big-score.ok { color: #b07d00; }
  .big-score.poor { color: var(--wrong); }
  .unit-breakdown { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; text-align: left; }
  .ub-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--bg); border-radius: 8px;
    font-size: 13px; border: 1px solid var(--border);
  }
  .ub-score { font-family: 'DM Mono', monospace; font-weight: 500; }
  .summary-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media(max-width:600px){
    .top-bar { padding: 12px 14px; }
    .top-bar h1 { font-size: 14px; }
    .main { padding: 18px 10px 60px; }
    .q-card { padding: 18px 14px 14px; }
    .scard-val { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>H&FM — MCQ Exam Prep · MEGA</h1>
  <div class="top-bar-right">
    <span id="global-score">0 / 0 answered</span>
    <button class="shuffle-btn" onclick="shuffleCurrentUnit()">⇄ Shuffle</button>
  </div>
</div>

<div class="unit-tabs" id="unit-tabs"></div>
<div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>

<div class="scorebar">
  <div class="scard"><span class="scard-val" id="s-ans">0/0</span><span class="scard-lbl">This unit</span></div>
  <div class="scard"><span class="scard-val c" id="s-cor">0</span><span class="scard-lbl">Correct (all)</span></div>
  <div class="scard"><span class="scard-val w" id="s-wrg">0</span><span class="scard-lbl">Wrong (all)</span></div>
  <div class="scard"><span class="scard-val" id="s-pct">—</span><span class="scard-lbl">Overall %</span></div>
</div>

<div class="main" id="main-area"></div>

<script>
const RAW_UNITS = [
  {
    name: "Unit 1: Nutrition",
    short: "Nutrition",
    qs: [
      {q:"According to WHO (2023), nutrition is best described as:",o:["Only the study of vitamins and minerals","The intake of food in relation to the body's dietary needs — a cornerstone of health and disease prevention","A synonym for dieting","Exclusively the measurement of caloric intake"],a:1,exp:"WHO (2023) defines nutrition as the intake of food considered in relation to the body's dietary needs, emphasizing its role as a cornerstone of good health, disease prevention, and longevity."},
      {q:"Which historical figure first coined the term 'vitamine'?",o:["Hippocrates","Antoine Lavoisier","Casimir Funk","James Lind"],a:2,exp:"Casimir Funk coined the term 'vitamine' in 1912. Hippocrates said 'Let food be thy medicine'; Lavoisier linked food energy to metabolism; Lind conducted the first dietary clinical trial (scurvy/citrus)."},
      {q:"What is the energy value of 1 gram of dietary fat?",o:["4 kcal/g","7 kcal/g","9 kcal/g","11 kcal/g"],a:2,exp:"Fats: 9 kcal/g — most energy-dense macronutrient. Carbohydrates and proteins: 4 kcal/g. Alcohol: 7 kcal/g."},
      {q:"The Acceptable Macronutrient Distribution Range (AMDR) for carbohydrates is:",o:["10–35% of total energy","20–35% of total energy","45–65% of total energy","55–75% of total energy"],a:2,exp:"Carbohydrates AMDR 45–65% | Protein 10–35% | Fat 20–35%. Minimum RDA for carbohydrates is 130 g/day (obligatory brain fuel)."},
      {q:"How many essential amino acids (EAAs) must be obtained from the diet?",o:["6","9","11","20"],a:1,exp:"9 EAAs: Histidine, Isoleucine, Leucine, Lysine, Methionine, Phenylalanine, Threonine, Tryptophan, Valine. All 20 amino acids exist, but only 9 are dietary-essential."},
      {q:"Kwashiorkor is characterized by:",o:["Total caloric and protein starvation leading to severe muscle wasting","Protein deficiency with adequate caloric intake — causing oedema, fatty liver, dermatitis","Iron deficiency causing pallor and fatigue","Vitamin C deficiency causing bleeding gums"],a:1,exp:"Kwashiorkor = protein deficiency with adequate calories. Signs: oedema, fatty liver, dermatitis, hair changes. Marasmus = total starvation (calories + protein), causing muscle wasting."},
      {q:"Which BMR equation is recommended by the Academy of Nutrition & Dietetics as most accurate?",o:["Harris-Benedict (1919, revised 1984)","Katch-McArdle equation","Mifflin-St Jeor equation (1990)","Cunningham equation"],a:2,exp:"Mifflin-St Jeor (1990) is most accurate (±10%) for the general population. Harris-Benedict overestimates by ~5% in obese individuals."},
      {q:"BMR (Basal Metabolic Rate) typically represents what percentage of Total Daily Energy Expenditure (TDEE)?",o:["20–30%","40–50%","60–70%","80–90%"],a:2,exp:"TDEE = BMR (60–70%) + Thermic Effect of Food/TEF (8–10%) + Exercise (20–30%). BMR is the largest component."},
      {q:"Deficiency of Vitamin C (Ascorbic acid) causes which disease?",o:["Rickets","Scurvy","Pellagra","Beriberi"],a:1,exp:"Scurvy = Vitamin C deficiency. Signs: bleeding gums, poor wound healing, fatigue, joint pain."},
      {q:"Vitamin D deficiency in children causes:",o:["Osteomalacia","Rickets","Xerophthalmia","Pellagra"],a:1,exp:"Rickets (children) = Vitamin D deficiency → bow legs, soft bones. In adults = Osteomalacia (soft bones, muscle weakness)."},
      {q:"Pellagra is caused by deficiency of which B-vitamin?",o:["Vitamin B1 (Thiamine)","Vitamin B2 (Riboflavin)","Vitamin B3 (Niacin)","Vitamin B6 (Pyridoxine)"],a:2,exp:"Niacin (B3) deficiency → Pellagra. The 4 Ds: Dermatitis, Diarrhoea, Dementia, Death."},
      {q:"Beriberi is caused by deficiency of:",o:["Vitamin B2 (Riboflavin)","Vitamin B1 (Thiamine)","Vitamin B12 (Cobalamin)","Vitamin K"],a:1,exp:"Thiamine (B1) deficiency → Beriberi. Wet Beriberi: cardiac failure, oedema. Dry Beriberi: peripheral neuropathy."},
      {q:"A BMI of 32 kg/m² falls under which WHO classification?",o:["Overweight (Pre-obese): BMI 25–29.9","Obese Class I: BMI 30–34.9","Obese Class II: BMI 35–39.9","Obese Class III (Morbid): BMI ≥40"],a:1,exp:"BMI 30.0–34.9 = Obese Class I. Asian cut-offs differ: overweight ≥23, obese ≥27.5."},
      {q:"The DASH diet reduces systolic blood pressure by approximately how much?",o:["2–4 mmHg","5–7 mmHg","8–14 mmHg","15–20 mmHg"],a:2,exp:"DASH diet reduces systolic BP by 8–14 mmHg — comparable to a single antihypertensive drug. Key: high Potassium (4700 mg/day), Calcium, Magnesium; limit sodium (<1500 mg/day)."},
      {q:"The Mediterranean diet reduces cardiovascular disease (CVD) risk by approximately:",o:["10%","20%","30%","50%"],a:2,exp:"PREDIMED study (2013/2018): Mediterranean diet reduces CVD by ~30%. Emphasizes olive oil, fish, vegetables, legumes, whole grains."},
      {q:"A food with Glycaemic Index (GI) below 55 is classified as:",o:["High GI","Medium GI","Low GI","Very low GI"],a:2,exp:"GI: Low <55 (lentils, oats). Medium 56–69. High ≥70 (white bread, white rice). Low-GI foods improve blood sugar control."},
      {q:"The loading protocol for creatine monohydrate involves:",o:["5g/day for 28 days","10g/day for 7 days","20g/day (4×5g doses) for 5–7 days","40g/day for 2 days"],a:2,exp:"Loading: 20g/day × 5–7 days → rapid phosphocreatine saturation. Maintenance: 3–5g/day. Alternatively 3–5g/day for 28 days achieves same steady-state."},
      {q:"Approximately how many kilocalories equal 1 kilogram of body fat?",o:["3,500 kcal","5,000 kcal","7,700 kcal","9,000 kcal"],a:2,exp:"~7,700 kcal = 1 kg body fat. Daily deficit 500 kcal ≈ 0.5 kg/week loss. Deficit 1,000 kcal/day ≈ 1 kg/week."},
      {q:"Which nutrient enhances the absorption of non-haem (plant-source) iron?",o:["Calcium","Vitamin D","Vitamin C (Ascorbic acid)","Vitamin E"],a:2,exp:"Vitamin C converts Fe³⁺ → Fe²⁺ (more absorbable), significantly enhancing non-haem iron absorption. Inhibitors: tannins, calcium, phytates."},
      {q:"What is the effect of trans fats (TFAs) on blood cholesterol?",o:["Raise HDL and lower LDL cholesterol","Raise LDL and lower HDL — highest CVD risk of any dietary fat","Raise LDL only, no effect on HDL","Lower both LDL and HDL equally"],a:1,exp:"Trans fats raise LDL AND lower HDL — making them the most harmful dietary fat. WHO REPLACE initiative targets global elimination."},
      {q:"Which macronutrient has the highest thermic effect of food (TEF)?",o:["Carbohydrates (5–10%)","Fats (0–3%)","Protein (20–30%)","Alcohol (15–20%)"],a:2,exp:"Protein has the highest TEF at 20–30%: the body burns 20–30% of protein's calories just digesting it. This makes protein important in weight management. Fat TEF: 0–3%. Carbs: 5–10%."},
      {q:"Water-soluble vitamins include:",o:["Vitamins A, D, E, K","Vitamins C and all B vitamins","Vitamins A, C, and K only","Vitamins D, E, and B12 only"],a:1,exp:"Water-soluble: Vitamin C + all 8 B-vitamins (B1, B2, B3, B5, B6, B7, B9, B12). They are not stored — excess is excreted in urine. Fat-soluble: ADEK — stored in fat tissue (risk of toxicity)."},
      {q:"The Recommended Dietary Allowance (RDA) is defined as:",o:["The minimum intake to prevent acute deficiency disease","The average daily intake sufficient to meet the requirements of ~97.5% of healthy individuals","The upper tolerable intake before adverse effects occur","The estimated average requirement across all population groups"],a:1,exp:"RDA = meets the nutrient requirements of 97.5% of healthy people of a specific age and sex. EAR meets 50% of the population. UL is the safe upper limit before adverse effects."},
      {q:"Dietary fibre's primary role in the gastrointestinal tract includes:",o:["Being absorbed in the small intestine as an energy source","Being fermented by gut microbiota and increasing stool bulk — reducing colorectal cancer risk","Being hydrolysed into glucose for direct energy use","Facilitating fat absorption in the jejunum"],a:1,exp:"Soluble fibre: fermented by gut bacteria → short-chain fatty acids. Insoluble fibre: increases stool bulk, reduces transit time, lowers colorectal cancer risk. Target: 25–38 g/day."},
      {q:"Omega-3 fatty acids (EPA and DHA) are primarily found in:",o:["Red meat and full-fat dairy products","Vegetable oils (sunflower, corn, soybean)","Fatty fish (salmon, mackerel, sardines, herring)","Refined grains and starchy vegetables"],a:2,exp:"EPA and DHA (long-chain omega-3s) predominantly from fatty fish. ALA (shorter-chain omega-3) from flaxseed, chia, walnuts — poor conversion to EPA/DHA in humans (~5–10%)."},
      {q:"Iron deficiency anaemia is characterised by which type of red blood cells?",o:["Macrocytic (large) hypochromic red blood cells","Microcytic (small) hypochromic red blood cells","Normocytic normochromic red blood cells","Spherocytic red blood cells"],a:1,exp:"Iron deficiency anaemia → microcytic (small), hypochromic (pale) RBCs — insufficient haemoglobin. B12/folate deficiency → macrocytic anaemia. Chronic disease → normocytic."},
      {q:"The hormone that primarily regulates long-term energy balance and suppresses appetite is:",o:["Ghrelin — secreted from adipose tissue during weight loss","Leptin — secreted from adipose tissue proportional to fat mass, signals satiety to the hypothalamus","Insulin — secreted from the pancreas to lower blood glucose","Cortisol — secreted from the adrenal cortex during chronic stress"],a:1,exp:"Leptin: secreted by fat cells proportional to fat mass; signals hypothalamus to suppress hunger. In obesity, leptin resistance develops. Ghrelin: 'hunger hormone' secreted from stomach — stimulates appetite."},
      {q:"Which vitamin is synthesized in the skin upon exposure to UVB radiation?",o:["Vitamin A","Vitamin C","Vitamin D","Vitamin K"],a:2,exp:"Vitamin D3 (cholecalciferol) is synthesized when UVB (290–315 nm) strikes 7-dehydrocholesterol in the skin. Activated in liver (25-OH-D) then kidneys (1,25-OH-D = calcitriol). Dietary sources: fatty fish, fortified foods, egg yolk."},
      {q:"The Maillard reaction in cooking:",o:["Degrades protein content and reduces nutritional value of foods","Is a non-enzymatic browning reaction between amino acids and reducing sugars, producing flavour compounds","Refers to the caramelisation of sucrose under high heat","Is a process of enzymatic browning seen in cut apples and bananas"],a:1,exp:"Maillard reaction: amino acids + reducing sugars + heat → brown colour + complex flavours (toasted bread, seared meat, coffee). Not the same as caramelisation (sugar only). Enzymatic browning: different mechanism (cut fruit)."},
      {q:"Vitamin B12 (Cobalamin) is crucial for:",o:["Collagen synthesis and antioxidant defence","DNA synthesis, myelin sheath maintenance, and red blood cell formation — deficiency causes megaloblastic anaemia","Calcium absorption from the small intestine","Blood clotting cascade (cofactor for clotting factors)"],a:1,exp:"B12: DNA synthesis, myelin sheath integrity, RBC maturation. Deficiency: megaloblastic anaemia + subacute combined degeneration of the spinal cord. At-risk: vegans, elderly (reduced intrinsic factor), pernicious anaemia."},
      {q:"Which dietary component is the primary driver of LDL ('bad') cholesterol elevation?",o:["Dietary cholesterol from eggs","Saturated fatty acids (especially lauric, myristic, palmitic acids)","Omega-6 polyunsaturated fatty acids","Dietary fibre and plant sterols"],a:1,exp:"Saturated fats (C12–C16) most strongly raise LDL by downregulating hepatic LDL receptors. Dietary cholesterol has modest effect. Trans fats raise LDL AND lower HDL. Fibre and plant sterols reduce LDL."},
      {q:"Xerophthalmia (night blindness, corneal ulceration) is caused by deficiency of:",o:["Vitamin C","Vitamin B2 (Riboflavin)","Vitamin A (Retinol)","Zinc"],a:2,exp:"Vitamin A (Retinol) deficiency → Xerophthalmia: night blindness → Bitot's spots → corneal ulceration → blindness. Leading cause of preventable childhood blindness globally. Sources: liver, dairy, egg yolk, orange/yellow produce (beta-carotene)."},
      {q:"The glycaemic load (GL) of a food differs from the glycaemic index (GI) because GL:",o:["Measures only the fat content of the food portion","Accounts for both the GI and the amount of carbohydrate in a typical serving — giving a more practical measure of blood glucose impact","Measures the protein-to-carbohydrate ratio","Is only applicable to diabetic patients, not healthy populations"],a:1,exp:"GL = GI × (carbohydrate per serving / 100). Watermelon has high GI (~72) but low GL (~4) because it has little carbohydrate per serving. GL is more clinically useful than GI alone."},
      {q:"Iodine deficiency primarily causes:",o:["Anaemia and hair loss","Goitre (thyroid gland enlargement) and hypothyroidism — cretinism in severe childhood deficiency","Scurvy and joint pain","Hypercalcaemia and kidney stones"],a:1,exp:"Iodine is essential for thyroid hormone (T3, T4) synthesis. Deficiency → goitre, hypothyroidism, weight gain, cold intolerance. In pregnancy/infancy: cretinism (irreversible intellectual disability). Prevention: iodised salt."},
      {q:"Protein's role in immune function includes:",o:["Providing direct energy during immune cell activation","Serving as the structural basis for antibodies (immunoglobulins), cytokines, and complement proteins","Enhancing fat absorption in the intestinal tract","Being converted to glucose via gluconeogenesis to fuel lymphocytes"],a:1,exp:"Antibodies (immunoglobulins), cytokines, complement proteins, and lymphocytes are all protein-based. Protein malnutrition (kwashiorkor) significantly impairs immune function, increasing infection susceptibility."},
      {q:"The recommended daily protein intake for resistance-trained athletes to maximise muscle protein synthesis (MPS) is:",o:["0.4–0.6 g/kg/day","0.8 g/kg/day (general population RDA)","1.6–2.2 g/kg/day","3.0–4.0 g/kg/day"],a:2,exp:"Evidence-based consensus (Morton et al., 2018): 1.6–2.2 g/kg/day optimises MPS for strength athletes. General RDA (0.8 g/kg/day) is a minimum to prevent deficiency, not an optimum for athletes. Higher amounts (>2.2 g/kg) show no additional anabolic benefit."},
    ]
  },
  {
    name: "Unit 2: Training",
    short: "Training",
    qs: [
      {q:"The principle of progressive overload states that:",o:["Exercise intensity should remain constant once a fitness level is achieved","Training stimulus must be gradually increased over time to continue eliciting physiological adaptation","Athletes should train at 100% maximum effort every session","Rest is more critical than training intensity for adaptation"],a:1,exp:"Progressive overload: systematically increase volume, intensity, or frequency to continually challenge the body beyond its current capacity. Without overload, adaptation plateaus."},
      {q:"The FITT principle of exercise prescription stands for:",o:["Force, Intensity, Timing, Technique","Frequency, Intensity, Time, Type","Function, Integration, Training, Target","Frequency, Interval, Tension, Threshold"],a:1,exp:"FITT = Frequency (how often), Intensity (% HRmax, RPE), Time (duration), Type (modality). Used to prescribe and progress exercise."},
      {q:"VO2max is defined as:",o:["The maximum speed an athlete can sustain for 60 minutes","The maximum volume of oxygen the body can use per minute during maximal exercise","The average oxygen consumption at complete rest","The minimum oxygen required to sustain anaerobic metabolism"],a:1,exp:"VO2max = maximal oxygen uptake (ml/kg/min). Gold standard measure of cardiorespiratory fitness. Elite endurance athletes: 70–90 ml/kg/min; sedentary adults: 30–40 ml/kg/min."},
      {q:"Type I (slow-twitch) muscle fibres are characterized by:",o:["High force production, fast contraction speed, low fatigue resistance","Low force production, slow contraction, high oxidative capacity — fatigue resistant","High force production, fast contraction, high fatigue resistance","Intermediate properties between Type I and Type IIx"],a:1,exp:"Type I = slow-twitch: high mitochondrial density, fat oxidation, fatigue-resistant — ideal for endurance. Type IIx = fast-twitch: high force, glycolytic, fatigue quickly — ideal for power/sprinting."},
      {q:"EPOC (Excess Post-exercise Oxygen Consumption) refers to:",o:["Oxygen debt that occurs before exercise begins","Elevated oxygen consumption after exercise to restore homeostasis — the 'afterburn effect'","Reduced oxygen utilization during low-intensity training","Maximum oxygen consumption during an all-out sprint"],a:1,exp:"EPOC = 'afterburn'. After intense exercise the body consumes extra O₂ to restore ATP-PC stores, clear lactate, reduce core temperature, and repair tissue. HIIT creates greater EPOC than steady-state."},
      {q:"Periodization in athletic training refers to:",o:["Restricting exercise sessions to 30-minute periods","Systematic variation of training variables in planned phases to optimize performance and prevent overtraining","Training exclusively in the morning hours for hormonal optimization","Performing only one type of exercise modality per session"],a:1,exp:"Periodization = planned manipulation of training variables across macrocycles (yearly), mesocycles (4–6 weeks), microcycles (weekly) to peak performance and prevent overtraining."},
      {q:"The SAID principle means:",o:["All exercise types produce identical adaptations","The body adapts specifically to the TYPE of training performed","Recovery specificity overrides training specificity","Nutrition specificity overrides training specificity"],a:1,exp:"SAID = Specificity. Swimmers adapt for swimming. Resistance training builds strength, not aerobic capacity. Exercise prescription must match performance goals."},
      {q:"What happens to VO2max during a period of detraining?",o:["VO2max continues increasing for weeks before declining","VO2max begins declining within 2 weeks, returning to pre-training levels within months","VO2max remains stable for 3 months then declines","VO2max only declines in older adults"],a:1,exp:"Detraining: VO2max declines within 2–4 weeks of inactivity. Muscle strength is better preserved (weeks to months). Regular training is essential to maintain adaptations."},
      {q:"WHO 2020 guidelines recommend adults (18–64 yrs) perform at least how much moderate-intensity aerobic activity per week?",o:["60–90 minutes","100–120 minutes","150–300 minutes","300–450 minutes"],a:2,exp:"WHO 2020: ≥150–300 min/week moderate aerobic OR ≥75–150 min vigorous (or equivalent combination) + muscle-strengthening ≥2 days/week."},
      {q:"During Zone 2 training (60–70% HRmax), which fuel source is predominantly utilized?",o:["Stored glycogen and blood glucose exclusively","Creatine phosphate (PCr system)","Fat (free fatty acids) as the primary fuel source","Dietary protein via gluconeogenesis"],a:2,exp:"Zone 2 = aerobic fat oxidation zone. Fat is dominant fuel. Above lactate threshold, carbohydrate (glycogen) becomes primary fuel. Zone 2 training improves metabolic flexibility and mitochondrial density."},
      {q:"The lactate threshold represents:",o:["The maximum heart rate achievable during all-out exercise","The exercise intensity at which lactate accumulation in the blood begins to exceed the rate of clearance","The minimum protein intake for muscle protein synthesis","The resting heart rate in highly trained endurance athletes"],a:1,exp:"Lactate threshold (LT): intensity where lactate production exceeds clearance — exponential rise in blood lactate. Training raises LT, allowing higher intensity to be sustained."},
      {q:"The most common formula to estimate maximum heart rate (HRmax) is:",o:["200 − age","220 − age","240 − (age × 0.5)","180 − (age × 0.65)"],a:1,exp:"HRmax = 220 − age is the most used formula. Individual variability ±10–12 bpm. More accurate: Tanaka (208 − 0.7×age) or graded exercise testing."},
      {q:"Compared to moderate-intensity steady-state cardio, HIIT burns approximately how much more calories?",o:["5–10% more","10–15% more","25–30% more","50–60% more"],a:2,exp:"HIIT burns ~25–30% more calories than moderate steady-state cardio per unit time. Combined with EPOC, HIIT is highly time-efficient for cardiorespiratory fitness and body composition."},
      {q:"The primary physiological benefits of a proper warm-up include:",o:["Maximizing glycogen depletion to force fat burning","Increasing core/muscle temperature, enhancing elasticity, preparing the neuromuscular system","Reducing heart rate to lower cardiovascular stress","Depleting ATP stores to maximize EPOC"],a:1,exp:"Warm-up raises core/muscle temperature → improves enzyme activity, muscle elasticity, nerve conduction, joint lubrication, cardiovascular response. Reduces injury risk and improves performance."},
      {q:"Overtraining syndrome (OTS) is characterized by:",o:["Rapid strength gains exceeding normal physiological expectations","Persistent performance decline, fatigue, mood disturbance, immune suppression despite adequate rest","Increased lean mass with reduced body fat","Higher-than-normal VO2max with increased training motivation"],a:1,exp:"OTS: performance decrements + persistent fatigue + mood disturbance + immune suppression despite ≥2 weeks adequate rest. Prevention: periodization, sleep (7–9 hrs), caloric adequacy, planned recovery."},
      {q:"Which energy system is the PRIMARY source for a 100m sprint lasting ~10 seconds?",o:["Aerobic oxidative system","Glycolytic (lactic acid) system","Phosphocreatine (ATP-PCr) system","Beta-oxidation of fatty acids"],a:2,exp:"ATP-PCr (phosphagen) system: immediate energy, no oxygen required. Lasts ~8–12 seconds max. 100m sprinters rely almost entirely on stored ATP and PCr. Glycolytic system then takes over for ~30–120 seconds."},
      {q:"The Borg Rating of Perceived Exertion (RPE) scale runs from:",o:["0 to 10","6 to 20","1 to 100","0 to 100"],a:1,exp:"Original Borg RPE scale: 6–20 (correlates with HR: multiply by ~10). Modified Borg scale: 0–10 (more commonly used in clinical settings). A rating of 13 on the original scale = 'somewhat hard' ≈ ~130 bpm."},
      {q:"In resistance training, hypertrophy (muscle growth) is primarily stimulated by:",o:["Training exclusively at 1-rep max loads","Mechanical tension, metabolic stress, and muscle damage from sufficient volume and load","Performing only isometric contractions for extended periods","Cardio performed immediately after weight training"],a:1,exp:"Three primary hypertrophy mechanisms (Schoenfeld, 2010): Mechanical tension (heavy loads), Metabolic stress (pump/lactate accumulation), Muscle damage (DOMS). Volume (sets × reps × weight) and progressive overload are key drivers."},
      {q:"The 'principle of reversibility' in training means:",o:["Training effects permanently remain even after exercise cessation","Adaptations gained from training are lost when training stops — 'use it or lose it'","Strength gains reverse direction when training is continued beyond a certain point","Exercise adaptation reverses in older adults but not younger athletes"],a:1,exp:"Reversibility: training adaptations are lost during prolonged inactivity (detraining). Cardiovascular fitness declines faster than strength. Motivates maintaining consistent training throughout the year."},
      {q:"Functional threshold power (FTP) in cycling represents:",o:["Maximum power achievable for a single pedal stroke","The highest average power output a cyclist can sustain for approximately 60 minutes","Power output at 50% of VO2max","Peak sprint power achieved in a 5-second maximal effort"],a:1,exp:"FTP = power at ~1-hour time trial effort, approximating lactate threshold power. Used to set training zones in cycling and triathlon. Commonly estimated from 20-min test × 0.95."},
      {q:"The oxygen debt (EPOC) after exercise is primarily used to replenish:",o:["Glycogen stores in the liver and muscles — fully restored within 30 minutes","ATP-PC stores, restore oxygen levels in blood/myoglobin, remove lactate, and restore core temperature","Body protein lost during catabolism during exercise","Fat stores depleted during aerobic exercise"],a:1,exp:"EPOC restores: ATP-PC stores (fast component), blood/muscle O₂ (haemoglobin/myoglobin), clears lactate (slow component), lowers elevated heart rate/temperature, supports protein resynthesis. Full EPOC recovery: up to 24h after maximal HIIT."},
      {q:"The principle of 'individuality' in training recognises that:",o:["All individuals respond identically to the same training stimulus","Genetic variation, age, sex, training history, and lifestyle mean individuals respond differently to identical training","Only genetically gifted athletes can achieve elite performance","Training should follow a one-size-fits-all programme for simplicity"],a:1,exp:"Individuality: same training programme produces different outcomes due to genetics (ACTN3, ACE gene variants), age, sex, training history, nutrition, sleep, stress. Effective programming must be individualised."},
      {q:"Cardiac output (Q) during maximal exercise can increase from ~5 L/min at rest to approximately:",o:["10–12 L/min","15–18 L/min","20–40 L/min","50–60 L/min"],a:2,exp:"Cardiac output = HR × Stroke Volume. At rest ~5 L/min. During maximal exercise: untrained ~20 L/min, highly trained athletes up to 35–40 L/min (due to greater stroke volume from cardiac remodelling — 'athlete's heart')."},
      {q:"The 'cool-down' after exercise serves to:",o:["Prevent all muscle soreness by completely eliminating metabolic waste products","Gradually reduce heart rate and blood pressure, clear lactate, and prevent venous pooling","Immediately replenish glycogen stores depleted during exercise","Increase delayed-onset muscle soreness to maximise hypertrophy stimulus"],a:1,exp:"Cool-down: gradual HR/BP reduction, venous return maintained (prevents pooling/fainting), lactate clearance facilitated, parasympathetic reactivation. Stretching during cool-down while muscles are warm improves flexibility."},
      {q:"What does the 'talk test' measure in exercise intensity assessment?",o:["Lactate threshold using blood samples","Maximum oxygen uptake via gas analysis","Ventilatory threshold — the intensity at which speaking becomes difficult, correlating with moderate-vigorous intensity boundary","Anaerobic threshold via muscle biopsy"],a:2,exp:"Talk test: at low intensity conversation is easy. At ventilatory threshold, speaking comfortably becomes difficult. Above threshold (vigorous), only short sentences possible. A practical field tool correlating with ~50–60% VO2max boundary."},
      {q:"Linear periodization involves:",o:["Random variation of volume and intensity each session","Progressing from high-volume/low-intensity to low-volume/high-intensity across a training cycle","Maintaining constant volume and intensity throughout all phases","Increasing both volume and intensity simultaneously throughout the year"],a:1,exp:"Linear (classical) periodization: start of cycle = high volume, low intensity (hypertrophy/endurance phase) → progressively reduce volume, increase intensity (strength → power phases) → peaking. Simple and effective for beginners."},
      {q:"The primary adaptation to endurance training at the cellular level is:",o:["Increased number of muscle fibres (hyperplasia)","Increased mitochondrial density and oxidative enzyme activity within muscle cells","Increased myosin heavy chain type IIx expression","Reduction in capillary density to improve oxygen diffusion efficiency"],a:1,exp:"Endurance training: ↑ mitochondrial density (mitochondrial biogenesis via PGC-1α), ↑ oxidative enzymes (citrate synthase, SDH), ↑ capillary density, ↑ myoglobin content, ↑ fat oxidation capacity. VO2max improves."},
      {q:"REST between sets is important because it allows:",o:["Complete glycogen resynthesis to occur between sets","Partial or full recovery of the phosphocreatine (PCr) system and clearance of metabolic by-products","Myofibrillar protein synthesis to begin within each set interval","Oxidation of intramuscular triglycerides for the next set"],a:1,exp:"PCr resynthesis: ~50% in 30s, ~95% in 3 min. Short rest (30–60s): metabolic stress for hypertrophy. Long rest (3–5 min): near-full PCr recovery → greater force/power output → better for strength/power training."},
      {q:"Muscle fibre Type IIa (fast-oxidative-glycolytic) compared to Type IIx is:",o:["Slower, more fatigue resistant, and more oxidative than Type IIx","Faster, more powerful, but completely incapable of oxidative metabolism","Identical to Type IIx in all metabolic and contractile properties","More fatigue resistant than Type I slow-twitch fibres"],a:0,exp:"Type IIa = intermediate: faster than Type I, more oxidative than Type IIx. Recruited in sustained high-intensity efforts (400–1500m running). Training can shift Type IIx → IIa, increasing oxidative capacity of fast fibres."},
      {q:"The Karvonen formula for calculating training heart rate uses:",o:["Percentage of maximum heart rate only","Heart Rate Reserve (HRR = HRmax − HRrest), added to resting HR to find target training HR","Lactate threshold heart rate as the sole reference point","Age-adjusted VO2max values from normative tables"],a:1,exp:"Karvonen: Target HR = HRrest + (HRR × %intensity). E.g., 65-year old, HRmax=155, HRrest=65: 70% intensity = 65 + (90 × 0.70) = 128 bpm. More personalised than straight % HRmax."},
    ]

  {
    name: "Unit 3: Psychology",
    short: "Psychology",
    qs: [
      {q:"According to WHO (2022), mental health is defined as:",o:["The complete absence of all mental disorders","A state of mental well-being enabling people to cope with stresses, realise abilities, learn, work well, and contribute to community","Psychological stability maintained exclusively through pharmacological intervention","Freedom from all forms of anxiety, stress, and negative emotion"],a:1,exp:"WHO 2022: 'A state of mental well-being that enables people to cope with the stresses of life, realise their abilities, learn well and work well, and contribute to their community.' Mental health ≠ absence of illness."},
      {q:"In Seligman's PERMA model of wellbeing, 'E' stands for:",o:["Exercise and physical activity","Empathy towards others","Engagement (flow state — deep absorption in meaningful activity)","Emotional regulation skills"],a:2,exp:"PERMA: P=Positive Emotions, E=Engagement (flow), R=Relationships, M=Meaning, A=Accomplishment. Widely used in positive psychology."},
      {q:"Which is NOT one of Ryff's six dimensions of psychological wellbeing?",o:["Self-acceptance","Personal growth","Financial stability","Purpose in life"],a:2,exp:"Ryff's Six: Self-Acceptance, Personal Growth, Purpose in Life, Environmental Mastery, Autonomy, Positive Relationships. Financial stability is external, not a psychological dimension."},
      {q:"Hans Selye's General Adaptation Syndrome (GAS) occurs in which correct sequence?",o:["Resistance → Alarm → Exhaustion","Alarm → Exhaustion → Resistance","Alarm → Resistance → Exhaustion","Exhaustion → Resistance → Alarm"],a:2,exp:"GAS: (1) Alarm — fight-or-flight; cortisol/adrenaline surge. (2) Resistance — adaptation attempt; ongoing arousal. (3) Exhaustion — resources depleted; burnout, immune collapse."},
      {q:"'Eustress' is best described as:",o:["Chronic, debilitating negative stress impairing health","Positive, short-term, motivating stress that facilitates performance and growth","The Exhaustion stage of GAS","An anxiety disorder triggered by academic or occupational pressure"],a:1,exp:"Eustress (Selye): positive stress — motivating, performance-enhancing, growth-promoting, short duration. Distress: negative, chronic, health-impairing. Both activate the same HPA axis response."},
      {q:"The Yerkes-Dodson Law describes the relationship between:",o:["Exercise intensity and muscle hypertrophy","Arousal/stress level and performance — an inverted-U relationship","Sleep quality and next-day cognitive performance","Nutritional status and emotional regulation"],a:1,exp:"Yerkes-Dodson: moderate arousal = optimal performance. Under-arousal = boredom. Over-arousal = anxiety, choking. Complex tasks require lower optimal arousal than simple tasks."},
      {q:"Hans Selye (1936) defined stress as:",o:["A state of chronic anxiety about future events","The non-specific response of the body to any demand for change","A purely psychological phenomenon with no physiological component","The consequence of poor time management"],a:1,exp:"Selye (1936): 'The non-specific response of the body to any demand for change.' Applies to both eustress and distress."},
      {q:"According to WHO (2022), approximately how many people globally live with a mental disorder?",o:["~200 million (1 in 40)","~350 million (1 in 20)","~970 million (1 in 8)","~1.5 billion (1 in 5)"],a:2,exp:"WHO 2022: ~1 in 8 people (~970 million) live with a mental disorder. Depression and anxiety are most common. COVID-19 pandemic significantly increased prevalence."},
      {q:"Generalized Anxiety Disorder (GAD) is primarily characterized by:",o:["Sudden, intense fear episodes (panic attacks)","Persistent, excessive, uncontrollable worry about multiple life areas lasting ≥6 months, impairing functioning","Fear specifically triggered by social evaluation","Irrational, intense fear of a specific object or situation"],a:1,exp:"GAD: excessive, uncontrollable worry across multiple domains (work, health, finances) persisting ≥6 months with functional impairment. Affects ~4% globally per year."},
      {q:"The biopsychosocial model of mental health considers the interaction of:",o:["Biological, emotional, and physical fitness factors","Psychological, spiritual, and environmental domains","Biological, psychological, and social factors","Genetic, hormonal, and neurological factors alone"],a:2,exp:"Biopsychosocial model: Biological (genetics, neurochemistry, hormones), Psychological (cognition, coping, trauma), Social (relationships, culture, SES) — all interact to determine mental health outcomes."},
      {q:"The STAI (State-Trait Anxiety Inventory) was developed by which researcher?",o:["Lazarus & Folkman (1984)","Hans Selye (1936)","Spielberger (1970)","Martin Seligman (1999)"],a:2,exp:"STAI developed by Spielberger (1970). 40 items: 20 measure State Anxiety (transient) and 20 measure Trait Anxiety (dispositional). Widely used in sports psychology and clinical research."},
      {q:"Lazarus & Folkman's Transactional Model (1984) states that psychological stress arises when:",o:["Cortisol levels exceed a critical threshold","Environmental demands are appraised as exceeding an individual's perceived coping resources","An individual scores above the 75th percentile on a trait anxiety inventory","Social support is completely absent"],a:1,exp:"Lazarus & Folkman: stress = a TRANSACTION between person and environment. Primary appraisal (is this threatening?) + Secondary appraisal (can I cope?). Stress results when demands exceed perceived resources."},
      {q:"'Anger-In' in anger expression theory refers to:",o:["Sudden explosive outbursts of anger expressed outwardly","Anger suppressed and held internally — associated with psychosomatic health risks","Healthy expression of anger through assertive communication","Anger controlled and redirected into productive problem-solving"],a:1,exp:"Anger-In = suppressed anger. Associated with hypertension, GI issues, cardiovascular disease. Anger-Out = externally expressed (interpersonal conflict risk). Anger Control = healthy regulation."},
      {q:"In the mental health continuum model, 'languishing' is characterized by:",o:["High energy, positive emotions, resilience, and engagement","Mild difficulties with some functional impairment","Absence of positive mental health, low mood, detachment, emptiness","Significant clinical distress requiring urgent professional intervention"],a:2,exp:"Languishing (Keyes): neither ill nor flourishing. Detachment, emptiness, low motivation, absence of positive wellbeing. Not a disorder, but requires attention."},
      {q:"According to WHO data, approximately how many deaths annually are attributed to suicide globally?",o:["~200,000 per year","~350,000 per year","~700,000 per year","~1.2 million per year"],a:2,exp:"WHO: ~700,000 suicide deaths per year — 4th leading cause of death in 15–29 year-olds globally. Mental health receives only ~2% of health budgets in most nations."},
      {q:"The 'fight-or-flight' response is mediated primarily by which hormones?",o:["Insulin and glucagon","Adrenaline (epinephrine) and noradrenaline (norepinephrine) from the adrenal medulla","Cortisol and aldosterone from the adrenal cortex","Thyroid hormones T3 and T4"],a:1,exp:"Fight-or-flight (Cannon): rapid sympathetic nervous system activation → adrenal medulla releases adrenaline/noradrenaline → increased HR, dilated pupils, increased blood glucose, bronchodilation. Cortisol is slower, from adrenal cortex (HPA axis)."},
      {q:"Cognitive Behavioural Therapy (CBT) is based on the premise that:",o:["Mental health problems are caused solely by biochemical imbalances requiring medication","Thoughts, feelings, and behaviours are interconnected — changing maladaptive thought patterns leads to improved emotional and behavioural outcomes","Past childhood trauma is the exclusive root cause of all psychological distress","Unconscious drives and conflicts determine all conscious behaviour"],a:1,exp:"CBT (Beck, Ellis): cognitive distortions (catastrophising, all-or-nothing thinking) cause/maintain emotional disorders. Changing thought patterns → changed feelings and behaviours. Evidence-based for depression, anxiety, PTSD, OCD."},
      {q:"The concept of 'flow' (optimal experience) was described by which psychologist?",o:["Abraham Maslow","Martin Seligman","Mihaly Csikszentmihalyi","Carl Rogers"],a:2,exp:"Csikszentmihalyi (1990): Flow = state of complete absorption in a challenging activity. Requires skill-challenge balance. Characterized by: loss of self-consciousness, time distortion, intrinsic motivation, effortless focus."},
      {q:"Maslow's Hierarchy of Needs is arranged (from base to peak) as:",o:["Safety → Physiological → Social → Esteem → Self-Actualisation","Physiological → Safety → Love/Belonging → Esteem → Self-Actualisation","Esteem → Physiological → Safety → Belonging → Self-Actualisation","Self-Actualisation → Esteem → Belonging → Safety → Physiological"],a:1,exp:"Maslow (1943): Physiological (food, water, sleep) → Safety (security) → Love/Belonging (relationships) → Esteem (achievement, status) → Self-Actualisation (realising full potential). Lower needs must be met before higher ones become motivating."},
      {q:"Which of the following is a characteristic of 'flourishing' in Keyes' mental health continuum?",o:["Persistent sadness, low energy, and social withdrawal","High levels of positive emotions, psychological wellbeing, and social engagement","Occasional stress managed without significant distress","A diagnosed mental disorder that is well-managed with medication"],a:1,exp:"Flourishing (Keyes): positive hedonic wellbeing (positive emotions) + positive psychological wellbeing (Ryff's dimensions) + positive social wellbeing. Associated with lower morbidity, mortality, and productivity loss."},
      {q:"The HPA (Hypothalamic-Pituitary-Adrenal) axis chronic stress response leads to elevated:",o:["Dopamine and serotonin","Cortisol and DHEA","GABA and glycine","Acetylcholine and noradrenaline"],a:1,exp:"HPA axis: hypothalamus → CRH → anterior pituitary → ACTH → adrenal cortex → cortisol. Chronic cortisol elevation: immunosuppression, impaired memory (hippocampal damage), weight gain (visceral fat), disrupted sleep, depression risk."},
      {q:"A phobia is defined as:",o:["Generalised worry about many areas of life for ≥6 months","An intense, irrational, disproportionate fear of a specific object/situation leading to avoidance behaviour","Repeated, intrusive thoughts combined with compulsive rituals","Recurrent unexpected panic attacks with persistent concern about future attacks"],a:1,exp:"Specific phobia (DSM-5): intense, irrational fear of specific objects (spiders, blood) or situations (heights, flying) disproportionate to actual threat, causing marked distress/avoidance. Treated with graduated exposure therapy."},
      {q:"Self-Determination Theory (SDT), developed by Deci and Ryan, proposes that intrinsic motivation requires satisfying three basic psychological needs:",o:["Achievement, Recognition, and Material Rewards","Autonomy, Competence, and Relatedness","Mastery, Power, and Affiliation","Freedom, Equality, and Dignity"],a:1,exp:"Deci & Ryan's SDT: Autonomy (sense of choice/volition), Competence (feeling effective), Relatedness (meaningful connection with others). When all three are satisfied, intrinsic motivation and wellbeing are highest. External rewards can undermine intrinsic motivation."},
      {q:"Which coping strategy involves attempting to change or eliminate the source of stress?",o:["Emotion-focused coping","Problem-focused coping","Avoidance coping","Denial coping"],a:1,exp:"Problem-focused coping (Lazarus & Folkman): directly addresses the stressor — planning, problem-solving, seeking information. Emotion-focused: managing emotional distress (not the stressor). Most effective when stressor is controllable."},
      {q:"Social support as a buffer against stress is best supported by which concept?",o:["The stress-performance inverted U hypothesis","The buffering hypothesis — social support reduces the negative effects of stress on health","Attribution theory — external attributions reduce perceived stress","Arousal regulation theory"],a:1,exp:"Buffering hypothesis (Cohen & Wills, 1985): social support protects against harmful effects of stress by providing emotional resources, information, and practical assistance. Direct effect hypothesis: social support benefits health regardless of stress level."},
      {q:"Post-Traumatic Growth (PTG) refers to:",o:["The psychological deterioration that follows prolonged trauma exposure","Positive psychological change emerging from the struggle with highly challenging life circumstances","The absence of PTSD symptoms after traumatic events","Cognitive avoidance strategies used to cope with trauma"],a:1,exp:"PTG (Tedeschi & Calhoun, 1996): some individuals report positive transformation after major adversity — greater personal strength, deeper relationships, new possibilities, spiritual growth, appreciation of life. PTG and distress can coexist."},
    ]
  },
  {
    name: "Unit 4: Injuries",
    short: "Injuries",
    qs: [
      {q:"The RICE protocol for acute soft tissue injuries stands for:",o:["Run, Ice, Compress, Elevate","Rest, Ice, Compression, Elevation","Rest, Immobilise, Cool, Exercise","Reduce, Ice, Compress, Evaluate"],a:1,exp:"RICE: Rest (stop activity), Ice (15–20 min every 2 hrs for first 48 hrs), Compression (crepe bandage), Elevation (above heart level). Immediate management for sprains, strains, and contusions."},
      {q:"The HARM acronym describes things to AVOID in the first 72 hours after a soft tissue injury. It stands for:",o:["Heat, Alcohol, Running, Massage","Hydration, Aspirin, Rest, Motion","Heat, Activity, Rest, Medication","Humidity, Alcohol, Running, Medication"],a:0,exp:"HARM = Heat (increases bleeding/swelling), Alcohol (increases bleeding, impairs healing), Running (re-injury risk), Massage (increases bruising/swelling in acute phase). Avoid all in first 72 hours."},
      {q:"A Greenstick fracture is best described as:",o:["A fracture where bone shatters into multiple fragments","An incomplete fracture where the bone bends on one side but does not break completely — common in children","A fracture in diseased bone weakened by osteoporosis","A hairline crack from repetitive loading"],a:1,exp:"Greenstick fracture: incomplete — like bending a green twig. Common in children (more flexible bones). Heals well with casting."},
      {q:"An Open (Compound) fracture is characterized by:",o:["Bone broken but skin intact","Bone end protrudes through or near the skin — very high infection risk","An incomplete fracture in a child's bone","A hairline crack visible only on MRI"],a:1,exp:"Open/compound fracture: bone protrudes through skin → contaminated wound → HIGH infection risk (osteomyelitis). Requires emergency management, surgical debridement, often internal fixation."},
      {q:"By definition, a sprain is a stretch or tear of:",o:["A muscle or its tendinous attachment","A ligament — fibrous connective tissue connecting bone to bone","The joint capsule or meniscus specifically","The bursae surrounding a joint"],a:1,exp:"SPRAIN = LIGAMENT injury (bone-to-bone). Causes: forced joint movement beyond normal range. Common sites: ankle (most common), knee (ACL, MCL), wrist."},
      {q:"By definition, a strain is a stretch or tear of:",o:["A ligament connecting two bones across a joint","The joint meniscus or articular cartilage","A muscle or tendon (muscle-to-bone connective tissue)","Articular cartilage or subchondral bone"],a:2,exp:"STRAIN = MUSCLE or TENDON injury. Caused by overstretching or violent muscular contraction. Common sites: hamstring, quadriceps, gastrocnemius, lower back."},
      {q:"A Grade III ligament sprain is defined as:",o:["Microscopic fibre tearing with maintained joint stability — 1–2 weeks recovery","Partial tear with moderate swelling and some instability — 3–6 weeks recovery","Complete ligament rupture with gross joint instability — may require surgery; 3–6 months recovery","Bone avulsion at the ligament attachment with no instability"],a:2,exp:"Grade III sprain = complete rupture. Significant swelling, bruising, gross instability. Requires orthopaedic referral; surgical reconstruction (e.g., ACL) may be needed. Recovery 3–6 months."},
      {q:"Scoliosis is defined as:",o:["Exaggerated forward (convex) curvature of the thoracic spine — 'hunchback'","Exaggerated inward (concave) curvature of the lumbar spine — 'hollow back'","Lateral (sideways) curvature of the spine — S-shaped or C-shaped","Pathological flattening of all normal spinal curves"],a:2,exp:"Scoliosis = lateral spinal curvature. Can be structural (fixed) or functional (posture-related). Most common in adolescent females (idiopathic). Diagnosed: Cobb angle on X-ray."},
      {q:"Kyphosis is defined as:",o:["Lateral deviation of the spine","Exaggerated inward (concave) curvature of the lumbar spine","Exaggerated outward (convex) rounding of the thoracic spine — 'hunchback'","Pathological flattening of the lumbar lordotic curve"],a:2,exp:"Kyphosis = excessive thoracic rounding. Types: Postural (reversible), Scheuermann's (structural, adolescents), Degenerative (elderly). Management: physiotherapy, posture correction."},
      {q:"Lordosis refers to:",o:["Lateral deviation of the spine","Excessive outward curvature of the thoracic spine","Exaggerated inward (concave) curvature of the lumbar spine — 'hollow back'","Pathological flattening of all spinal curvature"],a:2,exp:"Lordosis = exaggerated lumbar inward curve. Associated with weak abdominals, tight hip flexors, anterior pelvic tilt, and chronic lower back pain."},
      {q:"A Comminuted fracture is one where:",o:["The bone bends but does not break completely, common in children","The bone shatters into three or more separate fragments","A stress fracture results in a hairline crack with no displacement","The bone ends override each other (impacted fracture)"],a:1,exp:"Comminuted fracture: bone shatters into 3+ fragments. Typically from high-energy trauma (MVA, falls). Difficult to manage — often requires surgical fixation (ORIF) with plates, screws, or nails."},
      {q:"An abrasion wound is described as:",o:["A deep, narrow penetrating wound with high infection risk","A jagged tear through all skin layers requiring sutures","A superficial wound where the epidermis is scraped away ('road rash') — from friction","A wound from blunt force that does not break the skin"],a:2,exp:"Abrasion = superficial scraping of the epidermis (e.g., 'road rash'). Management: clean thoroughly, irrigate, antiseptic dressing. Usually heals without sutures. Risk: embedded debris."},
      {q:"A stress fracture is best described as:",o:["A fracture from a single, sudden high-impact event","A complete break in bone weakened by metabolic disease","A hairline crack from cumulative repetitive loading exceeding bone's remodelling capacity — common in runners","A fracture with bone fragments displaced >2mm from normal position"],a:2,exp:"Stress fracture = cumulative microtrauma from repetitive loading. Common sites: tibia, metatarsals, femur, navicular. High-risk: female athletes, low bone density, nutritional deficiency."},
      {q:"In a Grade I muscle strain, approximately what percentage of muscle fibres are disrupted?",o:["Less than 5% of fibres torn","5–50% of fibres torn","Greater than 50% of fibres torn","Complete muscle rupture with no intact fibres"],a:0,exp:"Grade I: <5% fibres torn. Mild pain, near-normal function, minimal swelling. Recovery 1–2 weeks. Grade II: 5–50% torn (moderate). Grade III: >50% / complete tear (severe, may need surgery)."},
      {q:"The primary distinguishing feature between a sprain and a strain is:",o:["Sprains are always more painful and take longer to heal","A sprain involves a LIGAMENT (bone-to-bone); a strain involves a MUSCLE or TENDON","Strains can only occur in the lower limbs; sprains can occur anywhere","Sprains never require imaging; strains always require MRI"],a:1,exp:"FUNDAMENTAL distinction: SPRAIN = ligament. STRAIN = muscle/tendon. Different tissues, different mechanisms, different rehabilitation. Central to all sports medicine and first aid assessment."},
      {q:"The acronym POLICE (updated from RICE) in acute injury management stands for:",o:["Protect, Optimal Loading, Ice, Compression, Elevation","Prevent, Observe, Limit, Ice, Compress, Elevate","Position, Offload, Immobilise, Cool, Elevate","Protection, Observation, Limit, Immobilise, Cold, Evaluate"],a:0,exp:"POLICE: Protect (prevent further injury), Optimal Loading (controlled early movement stimulates healing better than complete rest), Ice, Compression, Elevation. Replaced pure 'Rest' in RICE with more evidence-based Optimal Loading."},
      {q:"Plantar fasciitis most commonly presents as:",o:["Diffuse aching across the entire sole of the foot throughout the day","Sharp pain at the lateral malleolus during ankle inversion","Sharp, stabbing pain at the heel — particularly bad on first steps in the morning","Burning pain along the medial shin (anterior tibia)"],a:2,exp:"Plantar fasciitis: inflammation of the plantar fascia (foot arch connective tissue). Classic: sharp heel pain worst on first morning steps (post-static dyskinesia), improving with movement. Risk: flat feet, tight calves, obesity, prolonged standing."},
      {q:"Which classification of wound is characterized by a clean, straight incision with minimal tissue damage, caused by a sharp object?",o:["Abrasion","Contusion","Laceration","Incised wound"],a:3,exp:"Incised wound: clean, straight cut from a sharp instrument (knife, glass, surgical scalpel). Minimal surrounding tissue damage. Bleeds profusely due to clean vessel cutting. Heals well with proper closure. Compare laceration: jagged, torn edges."},
      {q:"The term 'FOOSH' injury (Fall On an Outstretched Hand) most commonly results in fracture of which bone?",o:["Femur","Tibia and fibula","Distal radius (Colles' fracture) or scaphoid","Clavicle"],a:2,exp:"FOOSH: most common result = Colles' fracture (distal radius, 'dinner fork' deformity) in older adults OR scaphoid fracture in younger adults. Scaphoid fractures are notorious for delayed diagnosis and avascular necrosis risk."},
      {q:"Shin splints (Medial Tibial Stress Syndrome — MTSS) is characterised by:",o:["Sharp lateral ankle pain worsening during inversion","Diffuse medial tibial pain along the lower two-thirds of the tibia — worse at the start and end of exercise","Sudden severe calf pain as if 'shot from behind' (Achilles rupture)","Deep knee pain worsening on stairs and squatting (patellofemoral syndrome)"],a:1,exp:"MTSS: diffuse medial tibial pain from repetitive stress — overuse injury in runners. Caused by: overpronation, sudden training increase, hard surfaces, poor footwear. Management: RICE, activity modification, biomechanical correction."},
      {q:"A concussion is best defined as:",o:["A visible bruise on the cerebral cortex seen on CT scan","A traumatic brain injury causing transient neurological dysfunction from biomechanical forces — no structural brain damage visible on imaging","A haemorrhage between the skull and dura mater","A spinal cord contusion causing temporary paralysis"],a:1,exp:"Concussion (mTBI): transient neurological impairment (confusion, amnesia, headache, dizziness, balance problems) from biomechanical head force. No structural damage on CT/MRI. Requires removal from play and graduated return-to-play protocol."},
      {q:"The 'Ottawa Ankle Rules' are used in emergency settings to determine:",o:["Whether soft tissue physiotherapy is needed after ankle sprain","Whether X-ray is required to rule out fracture after ankle injury (based on specific clinical criteria)","The severity grading of an ankle ligament sprain","The rehabilitation protocol for Grade II ankle sprains"],a:1,exp:"Ottawa Ankle Rules: clinical decision tool. X-ray needed if: bony tenderness at posterior edge of lateral/medial malleolus, or inability to weight-bear 4 steps. High sensitivity (96–100%) for ruling out fractures. Reduces unnecessary X-rays."},
      {q:"The rotator cuff of the shoulder consists of which four muscles?",o:["Deltoid, Biceps, Triceps, Coracobrachialis","Supraspinatus, Infraspinatus, Teres Minor, Subscapularis","Pectoralis Major, Latissimus Dorsi, Teres Major, Subscapularis","Trapezius, Rhomboids, Serratus Anterior, Levator Scapulae"],a:1,exp:"Rotator cuff (SITS): Supraspinatus (abduction initiation), Infraspinatus (external rotation), Teres Minor (external rotation), Subscapularis (internal rotation). Stabilises the glenohumeral joint. Supraspinatus most commonly torn (impingement, overhead sports)."},
      {q:"Delayed Onset Muscle Soreness (DOMS) typically peaks at:",o:["Immediately after exercise cessation","6–12 hours post-exercise","24–72 hours post-exercise","5–7 days post-exercise"],a:2,exp:"DOMS: peaks 24–72 hours post-exercise. Caused primarily by eccentric muscle contractions causing micro-structural damage (myofibrillar disruption), inflammation, and swelling. NOT caused by lactic acid accumulation."},
      {q:"An avulsion fracture occurs when:",o:["A bone shatters into multiple pieces from direct high-energy impact","A bone fragment is pulled away at the point of ligament or tendon attachment due to sudden muscular contraction","A bone bends and partially breaks on one side only (incomplete fracture)","A diseased bone breaks spontaneously without any trauma"],a:1,exp:"Avulsion fracture: a tendon or ligament pull rips off a piece of bone at its attachment. Common sites: base of 5th metatarsal (peroneus brevis), anterior inferior iliac spine (ASIS — rectus femoris), tibial tuberosity (patellar tendon)."},
      {q:"Impetigo is a skin condition of particular concern in contact sports because:",o:["It causes severe joint inflammation leading to temporary restriction from sport","It is a highly contagious bacterial skin infection (Staphylococcus/Streptococcus) requiring exclusion from contact sports","It is a viral infection causing respiratory distress in athletes during high-intensity exercise","It is a fungal skin condition affecting only immunocompromised athletes"],a:1,exp:"Impetigo: highly contagious bacterial skin infection (golden/honey-coloured crusting). Direct contact spreads it rapidly in contact sports (wrestling, rugby). Athletes must be excluded from contact until lesions are fully healed/crusted."},
    ]
  }
];

// Shuffle utility
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Working copies (can be shuffled)
let UNITS = RAW_UNITS.map(u => ({ ...u, qs: [...u.qs] }));

let currentUnit = 0;
let currentQ = 0;
let answers = {};
let scores = UNITS.map(() => ({ c: 0, w: 0, done: 0 }));

const badgeClass = ['badge-u0','badge-u1','badge-u2','badge-u3'];
const progClass = ['u0','u1','u2','u3'];

function shuffleCurrentUnit() {
  // Reset answers and score for this unit
  const key = currentUnit;
  for (const k of Object.keys(answers)) {
    if (k.startsWith(key + '-')) delete answers[k];
  }
  scores[currentUnit] = { c: 0, w: 0, done: 0 };
  UNITS[currentUnit].qs = shuffle(RAW_UNITS[currentUnit].qs);
  currentQ = 0;
  renderQ();
}

function switchUnit(u) {
  currentUnit = u;
  currentQ = 0;
  renderTabs();
  renderQ();
}

function renderTabs() {
  document.getElementById('unit-tabs').innerHTML = UNITS.map((u, i) =>
    `<button class="utab${i === currentUnit ? ' active' : ''}" data-unit="${i}" onclick="switchUnit(${i})">${u.short} (${u.qs.length})</button>`
  ).join('');
}

function updateStats() {
  const u = scores[currentUnit];
  const qs = UNITS[currentUnit].qs;
  document.getElementById('s-ans').textContent = `${u.done}/${qs.length}`;
  const tc = scores.reduce((a, s) => a + s.c, 0);
  const tw = scores.reduce((a, s) => a + s.w, 0);
  const tot = tc + tw;
  document.getElementById('s-cor').textContent = tc;
  document.getElementById('s-wrg').textContent = tw;
  document.getElementById('s-pct').textContent = tot > 0 ? Math.round(tc / tot * 100) + '%' : '—';
  const totalAnswered = scores.reduce((a, s) => a + s.done, 0);
  const totalQs = UNITS.reduce((a, u) => a + u.qs.length, 0);
  document.getElementById('global-score').textContent = `${totalAnswered} / ${totalQs} answered`;
  const pct = u.done / qs.length * 100;
  const prog = document.getElementById('prog');
  prog.style.width = pct + '%';
  prog.className = 'prog-fill ' + progClass[currentUnit];
}

function renderQ() {
  const qs = UNITS[currentUnit].qs;
  if (currentQ >= qs.length) { renderSummary(); return; }
  const q = qs[currentQ];
  const key = currentUnit + '-' + currentQ;
  const prev = answers[key];
  const area = document.getElementById('main-area');

  const optsHTML = q.o.map((opt, i) => {
    let cls = 'opt';
    if (prev !== undefined) {
      cls += ' done';
      if (i === q.a) cls += ' correct';
      else if (i === prev && prev !== q.a) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="choose(${i})"><span class="opt-key">${['A','B','C','D'][i]}</span><span>${opt}</span></button>`;
  }).join('');

  let expHTML = '';
  if (prev !== undefined) {
    const isCorrect = prev === q.a;
    expHTML = `<div class="explanation show ${isCorrect ? 'correct' : 'wrong'}">
      <strong>${isCorrect ? '✓ Correct!' : '✗ Incorrect — correct answer: ' + ['A','B','C','D'][q.a]}</strong>${q.exp}
    </div>`;
  }

  area.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-badge ${badgeClass[currentUnit]}">${UNITS[currentUnit].name}</span>
        <span class="q-num">Q ${currentQ + 1} of ${qs.length}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHTML}</div>
      ${expHTML}
      <div class="nav-row">
        <button class="btn" onclick="prevQ()" ${currentQ === 0 ? 'disabled' : ''}>← Prev</button>
        <span style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace">${currentQ + 1} / ${qs.length}</span>
        <button class="btn primary" onclick="nextQ()" ${prev === undefined ? 'disabled' : ''}>${currentQ < qs.length - 1 ? 'Next →' : 'Finish →'}</button>
      </div>
    </div>
  `;
  updateStats();
}

function choose(i) {
  const key = currentUnit + '-' + currentQ;
  if (answers[key] !== undefined) return;
  const q = UNITS[currentUnit].qs[currentQ];
  answers[key] = i;
  if (i === q.a) scores[currentUnit].c++;
  else scores[currentUnit].w++;
  scores[currentUnit].done++;
  renderQ();
}

function nextQ() {
  currentQ = Math.min(currentQ + 1, UNITS[currentUnit].qs.length);
  renderQ();
}

function prevQ() {
  currentQ = Math.max(currentQ - 1, 0);
  renderQ();
}

function renderSummary() {
  const u = scores[currentUnit];
  const pct = u.done > 0 ? Math.round(u.c / u.done * 100) : 0;
  const gradeText = pct >= 80 ? '🎯 Exam ready!' : pct >= 60 ? '👍 Good — review weak areas' : '📚 Needs improvement — revisit the material';
  const pctClass = pct >= 80 ? 'great' : pct >= 60 ? 'ok' : 'poor';
  const tc = scores.reduce((a, s) => a + s.c, 0);
  const td = scores.reduce((a, s) => a + s.done, 0);
  const overallPct = td > 0 ? Math.round(tc / td * 100) : 0;

  const unitRows = UNITS.map((u2, i) => {
    const s = scores[i];
    const sp = s.done > 0 ? `${Math.round(s.c / s.done * 100)}% (${s.c}/${s.done})` : 'Not started';
    return `<div class="ub-row"><span>${u2.name}</span><span class="ub-score">${sp}</span></div>`;
  }).join('');

  const nextBtn = currentUnit < UNITS.length - 1
    ? `<button class="btn primary" onclick="switchUnit(${currentUnit + 1})">Next unit →</button>`
    : `<button class="btn primary" onclick="switchUnit(0)">Restart all</button>`;

  document.getElementById('main-area').innerHTML = `
    <div class="summary-card">
      <h2>${UNITS[currentUnit].short} — Unit Complete</h2>
      <p class="sub">${gradeText}</p>
      <div class="big-score ${pctClass}">${pct}%</div>
      <div style="font-size:14px;margin-bottom:20px;color:var(--muted)">${u.c} correct out of ${u.done} questions</div>
      <div class="unit-breakdown">${unitRows}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Overall: <strong>${overallPct}%</strong> (${tc}/${td})</div>
      <div class="summary-btns">
        <button class="btn" onclick="currentQ=0;renderQ()">Retry this unit</button>
        ${nextBtn}
      </div>
    </div>
  `;
  updateStats();
}

// INIT
renderTabs();
renderQ();
</script>
</body>
</html>
